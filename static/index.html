<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local LLM Chat</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1c1e21; --user:#2563eb; --bot:#e8eaee; --border:#d8dbe0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --panel:#1a1d23; --text:#e6e8eb; --user:#3b6fe0; --bot:#2a2e36; --border:#333843; }
  }
  * { box-sizing: border-box; }
  body { margin:0; height:100dvh; display:flex; flex-direction:column; background:var(--bg); color:var(--text);
         font:16px/1.5 system-ui, sans-serif; }
  header { padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--border);
           display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:1rem; margin:0; }
  button { font:inherit; cursor:pointer; border:1px solid var(--border); background:var(--panel);
           color:var(--text); border-radius:8px; padding:6px 12px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:min(720px,85%); padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--user); color:#fff; }
  .bot { align-self:flex-start; background:var(--bot); }
  form { display:flex; gap:8px; padding:12px 16px; background:var(--panel); border-top:1px solid var(--border); }
  textarea { flex:1; resize:none; font:inherit; padding:10px; border-radius:10px; border:1px solid var(--border);
             background:var(--bg); color:var(--text); }
  #send { background:var(--user); color:#fff; border:0; padding:0 18px; }
  #send:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header><h1>Local LLM Chat · Qwen2.5-1.5B</h1><button id="clear" type="button">New chat</button></header>
<div id="log"></div>
<form id="form">
  <textarea id="input" rows="2" placeholder="Type a message… (Enter to send, Shift+Enter for newline)" autofocus></textarea>
  <button id="send">Send</button>
</form>
<script>
const log = document.getElementById("log"), input = document.getElementById("input"),
      send = document.getElementById("send");
let history = [];

function add(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + (role === "user" ? "user" : "bot");
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

async function ask(text) {
  history.push({ role: "user", content: text });
  add("user", text);
  const bot = add("assistant", "…");
  send.disabled = true;
  let reply = "";
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const p of parts) {
        const data = p.replace(/^data: /, "");
        if (data === "[DONE]") continue;
        reply += JSON.parse(data);
        bot.textContent = reply;
        log.scrollTop = log.scrollHeight;
      }
    }
    history.push({ role: "assistant", content: reply });
  } catch (e) {
    bot.textContent = "Error: " + e.message;
    history.pop();
  } finally {
    send.disabled = false;
    input.focus();
  }
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = "";
  ask(text);
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); }
});
document.getElementById("clear").onclick = () => { history = []; log.innerHTML = ""; };
</script>
</body>
</html>
